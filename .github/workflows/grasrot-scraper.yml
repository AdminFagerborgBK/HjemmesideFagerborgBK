name: Grasrotandelen Scraper

# Calls the backend function that reads Norsk Tipping's official JSON API.
# No browser/page scraping (the old page scraper broke when the page changed).

on:
  schedule:
    # Daily at 12:07 UTC
    - cron: '7 12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install response reader
        run: python3 -m pip install --quiet openpyxl

      - name: Update Grasrotandelen data
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          MATCHES_SYNC_SECRET: ${{ secrets.MATCHES_SYNC_SECRET }}
        run: python3 scripts/fingerprint/sync.py grasrot
