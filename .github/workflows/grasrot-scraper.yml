name: Grasrotandelen Scraper

# Calls the backend function that reads Norsk Tipping's official JSON API.
# No browser/page scraping (the old page scraper broke when the page changed).

on:
  schedule:
    # Daily at 06:07 UTC
    - cron: '7 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Update Grasrotandelen data
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            -H 'Content-Type: application/json' \
            -H "x-sync-secret: ${{ secrets.MATCHES_SYNC_SECRET }}" \
            -d '{}' \
            "${{ secrets.SUPABASE_PROJECT_URL }}/functions/v1/grasrot-scrape"
