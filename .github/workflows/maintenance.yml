name: Maintenance

# Housekeeping that used to run from the database scheduler.
# Runs from GitHub instead so the database is never woken
# just to confirm that nothing needs doing.
#
# - Cleanup + token health: weekly (Mondays)

on:
  schedule:
    # Mondays 05:10 UTC — weekly housekeeping
    - cron: '10 5 * * 1'
  workflow_dispatch:

jobs:
  weekly-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Clean up expired livestream codes
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "x-sync-secret: ${{ secrets.MATCHES_SYNC_SECRET }}" \
            -d '{}' \
            "${{ secrets.SUPABASE_PROJECT_URL }}/functions/v1/cleanup-otp"

      - name: Check Facebook token health
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H "x-sync-secret: ${{ secrets.MATCHES_SYNC_SECRET }}" \
            -d '{"action":"check"}' \
            "${{ secrets.SUPABASE_PROJECT_URL }}/functions/v1/facebook-token-health"
