name: Sports Data Sync (change-gated)

# Fingerprints the official fotball.no tournament calendars (which contain
# fixtures AND results). The Lovable backend is only contacted when the
# source data has actually changed, so an idle week means zero backend work.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sync even if source data is unchanged'
        type: boolean
        default: false

concurrency:
  group: sports-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous fingerprint
        uses: actions/cache/restore@v4
        with:
          path: fingerprint.txt
          key: sports-fingerprint-${{ github.run_id }}
          restore-keys: |
            sports-fingerprint-

      - name: Install reader
        run: python3 -m pip install --quiet openpyxl

      - name: Validate sources and sync both datasets
        id: sync
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          MATCHES_SYNC_SECRET: ${{ secrets.MATCHES_SYNC_SECRET }}
          FORCE_SYNC: ${{ inputs.force }}
        run: python3 scripts/fingerprint/sync.py sports

      - name: Save fingerprint
        if: steps.sync.outputs.synced == 'true'
        uses: actions/cache/save@v4
        with:
          path: fingerprint.txt
          key: sports-fingerprint-${{ github.run_id }}
